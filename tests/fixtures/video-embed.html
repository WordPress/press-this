<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page with Video Embeds</title>

    <!-- Open Graph for Video -->
    <meta property="og:title" content="Video Embed Test">
    <meta property="og:description" content="Page with embedded videos for testing scraper.">
    <meta property="og:type" content="video.other">
    <meta property="og:video" content="https://www.youtube.com/embed/dQw4w9WgXcQ">
</head>
<body>
    <h1>Test Page with Video Embeds</h1>
    <p>This page contains embedded videos for testing the URL scraper.</p>

    <!-- YouTube embed -->
    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        frameborder="0"
        allowfullscreen>
    </iframe>

    <!-- Vimeo embed -->
    <iframe
        src="https://player.vimeo.com/video/123456789"
        width="640"
        height="360"
        frameborder="0"
        allowfullscreen>
    </iframe>

    <img src="https://example.com/video-thumbnail.jpg" alt="Video thumbnail">
</body>
</html>
