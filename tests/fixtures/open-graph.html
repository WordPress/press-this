<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page with Open Graph</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Open Graph Test Title">
    <meta property="og:description" content="This is a test description for Open Graph metadata extraction.">
    <meta property="og:image" content="https://example.com/og-image.jpg">
    <meta property="og:url" content="https://example.com/test-page">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Example Site">

    <!-- Standard Meta -->
    <meta name="description" content="Standard meta description for the page.">
</head>
<body>
    <h1>Test Page with Open Graph</h1>
    <p>This page contains Open Graph metadata for testing the URL scraper.</p>
    <img src="https://example.com/content-image-1.jpg" alt="Content image 1">
    <img src="https://example.com/content-image-2.jpg" alt="Content image 2">
</body>
</html>
