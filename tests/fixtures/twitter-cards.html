<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page with Twitter Cards</title>

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Twitter Card Test Title">
    <meta name="twitter:description" content="This is a test description for Twitter Card metadata extraction.">
    <meta name="twitter:image" content="https://example.com/twitter-image.jpg">
    <meta name="twitter:site" content="@examplesite">
    <meta name="twitter:creator" content="@testauthor">

    <!-- Standard Meta -->
    <meta name="description" content="Standard meta description for the page.">
</head>
<body>
    <h1>Test Page with Twitter Cards</h1>
    <p>This page contains Twitter Card metadata for testing the URL scraper.</p>
    <img src="https://example.com/body-image.jpg" alt="Body image">
</body>
</html>
